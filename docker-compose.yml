services:
  mysql-econome-participantes:
    image: 'mysql:8.0'
    volumes:
      - ./mysql-data-participantes:/var/lib/mysql
    environment:
      - 'MYSQL_DATABASE=econome_db_participantes'
      - 'MYSQL_ROOT_PASSWORD=12345'
      - TZ=America/Sao_Paulo
    ports:
      # host:container -> expõe 3309 no host apontando para 3306 dentro do container
      - '3309:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - econome-net

  app-econome-participantes:
    build: .
    depends_on:
      mysql-econome-participantes:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_LIQUIBASE_ENABLED: ${SPRING_LIQUIBASE_ENABLED}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    ports:
      - '8081:8081'
    networks:
      - econome-net

networks:
  econome-net:
    external: true