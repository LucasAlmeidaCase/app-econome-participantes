spring:
  application:
    name: app-econome-participantes
  datasource:
    # Todos os valores abaixo podem ser sobrescritos via variáveis de ambiente
    # definidas no .env ou no ambiente do container.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-econome-participantes:3306/econome_db_participantes?useUnicode=true&characterEncoding=utf8&useSSL=false&useTimezone=true&serverTimezone=America/Sao_Paulo}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:config/liquibase/db.changelog-master.yml
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
server:
  port: 8081